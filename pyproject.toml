[project]
name = "base-agent-langchain"
version = "0.1.0"
description = "Base Agent implementation using LangChain"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastembed==0.8.0",
    "langchain==1.3.13",
    "langchain-classic==1.0.8",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai==1.3.5",
    "langchain-pymupdf4llm==1.28.0",
    "langchain-qdrant==1.1.0",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langfuse==4.14.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langgraph-supervisor==0.0.31",
    "presidio-analyzer==2.2.363",
    "presidio-anonymizer==2.2.363",
    "pydantic-settings==2.14.2",
    "spacy==3.8.13",
    "sqlactive==0.4.0",
    "structlog==26.1.0",
    "uuid-utils==0.17.0",
    "vt-py==0.22.0",
]

[project.optional-dependencies]
rest = [
    "asgi-correlation-id==5.0.1",
    "fastapi[standard]==0.139.0",
    "limits==5.8.0",
    "python-json-logger==4.1.0",
]

[dependency-groups]
dev = [
    "streamlit==1.59.1",
]
